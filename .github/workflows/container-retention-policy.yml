name: GHCR container retention

on:
  workflow_dispatch:
    inputs:
      test-package:
        description: Disposable ghcr-retention-test-* package (empty previews production)
        type: string
      reviewed-run:
        description: Successful test preview run ID to verify again (optional)
        type: string
  schedule:
    - cron: "0 1 * * *"

concurrency:
  group: ghcr-dashboard-retention

permissions: {}

jobs:
  preview:
    name: Retention preview
    if: github.repository == 'heckenmann/docker-swarm-dashboard' && github.ref == 'refs/heads/master' && inputs.reviewed-run == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      package: ${{ steps.target.outputs.package }}
      cutoff: ${{ steps.target.outputs.cutoff }}
    steps:
      - name: Scope the preview
        id: target
        env:
          TEST_PACKAGE: ${{ inputs.test-package }}
        run: |
          if [[ -z "$TEST_PACKAGE" ]]; then
            package=docker-swarm-dashboard
            cutoff=30d
          elif [[ "$TEST_PACKAGE" =~ ^ghcr-retention-test-[a-z0-9-]+$ ]]; then
            package=$TEST_PACKAGE
            cutoff=1h
          else
            echo "::error::Invalid test package name"
            exit 1
          fi
          # The apply check uses this log marker to bind the preview to the package.
          echo "Retention preview package: $package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"

      - name: Preview GHCR retention
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GHCR_TOKEN }}
          image-names: ${{ steps.target.outputs.package }}
          tag-selection: untagged
          cut-off: ${{ steps.target.outputs.cutoff }}
          timestamp-to-use: created_at
          dry-run: true

  verify:
    name: Verify retention candidates
    needs: preview
    if: >-
      !cancelled() && github.repository == 'heckenmann/docker-swarm-dashboard' &&
      github.ref == 'refs/heads/master' &&
      (needs.preview.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.reviewed-run != ''))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install registry client
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32
        with:
          release: v0.11.7

      - name: Verify exact Snok preview candidates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PACKAGE: ${{ needs.preview.outputs.package || inputs.test-package }}
          REVIEWED_RUN: ${{ inputs.reviewed-run }}
        run: bash .github/scripts/check-retention-preview.sh

      - name: Delete verified versions with Snok
        if: steps.check.outputs.apply == 'true'
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GHCR_TOKEN }}
          image-names: ${{ needs.preview.outputs.package || inputs.test-package }}
          tag-selection: untagged
          cut-off: ${{ needs.preview.outputs.cutoff || '1h' }}
          timestamp-to-use: created_at
          # Limit Snok to the exact versions approved by the verifier.
          skip-shas: ${{ steps.check.outputs.skip-shas }}
          dry-run: false

      - name: Confirm only the verified versions were deleted
        if: steps.check.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PACKAGE: ${{ needs.preview.outputs.package || inputs.test-package }}
          RETAINED_IDS: ${{ steps.check.outputs.retained-ids }}
          RETAINED_DIGESTS: ${{ steps.check.outputs.skip-shas }}
        run: |
          set -euo pipefail
          # Verify the outcome directly because Snok can finish with individual
          # deletion failures. Compare both remaining IDs and digests.
          gh api --paginate --slurp "users/heckenmann/packages/container/$PACKAGE/versions?state=active&per_page=100" |
            jq -e --argjson retained_ids "$RETAINED_IDS" --arg retained_digests "$RETAINED_DIGESTS" '
              [ .[][] | .id ] as $ids |
              [ .[][] | .name ] as $digests |
              ($ids | sort) == ($retained_ids | sort) and
              ($digests | sort) == ($retained_digests | split(",") | sort)
            ' >/dev/null
