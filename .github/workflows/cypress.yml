# Workflow to run Cypress tests on multiple architectures and browsers
name: Cypress

env:
  WORKING_DIRECTORY: ./app-src
  NODE_VERSION: '26'
  CYPRESS_VERIFY_TIMEOUT: '100000'
  CYPRESS_SHARDS: '4'
  MOCK_PERSIST: '0'

# Trigger the workflow on pull request or manual dispatch
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: shards
        working-directory: ./app-src
        run: node scripts/shard-cypress-specs.cjs
  # Install dependencies and update browserslist once per runner architecture,
  # then cache the result for all matrix browser jobs to share.
  prep:
    timeout-minutes: 15
    name: Install & update browserslist (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app-src/yarn.lock

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-${{ runner.arch }}-cypress-binary-${{ hashFiles('**/app-src/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cypress-binary-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Resolve prepared dependency cache key
        id: prepared-cache
        uses: actions/cache/restore@v6
        with:
          path: app-src/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-node-modules-sharding-v1-${{ hashFiles('app-src/yarn.lock') }}

      - name: Update browserslist
        run: NPM_CONFIG_LEGACY_PEER_DEPS=true npx update-browserslist-db@latest

      - name: Cache node_modules
        if: steps.prepared-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app-src/node_modules
          key: ${{ steps.prepared-cache.outputs.cache-primary-key }}

  # Run Cypress tests across all browsers; restore the cache written by prep.
  cypress-run:
    name: Cypress (${{ matrix.runner }}, ${{ matrix.browser }}, ${{ matrix.shard }}/${{ matrix.shardCount }})
    needs: [discover, prep]
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app-src/yarn.lock

      - name: Restore Cypress binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-${{ runner.arch }}-cypress-binary-${{ hashFiles('**/app-src/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cypress-binary-

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache/restore@v6
        with:
          path: app-src/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-node-modules-sharding-v1-${{ hashFiles('app-src/yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile

      - name: Download assets
        run: node download-files.js

      - name: Cypress run
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_ASSIGNMENT: ${{ toJSON(matrix) }}
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          start: yarn run start:servers
          install: false
          command: node scripts/run-cypress-shard.cjs
          wait-on: 'http://localhost:3000, http://localhost:3001/health'

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-report-${{ matrix.runner }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: app-src/cypress/reports/report.json
          if-no-files-found: error
          retention-days: 7

  # Gate job for Required Status Checks – always runs so branch protection
  # never stalls when cypress-run is skipped.
  cypress-tests-passed:
    needs: [discover, prep, cypress-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: cypress-report-*
          path: app-src/cypress/reports
      - name: Check Cypress results
        if: always()
        working-directory: ./app-src
        env:
          CYPRESS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-cypress-shards.cjs
