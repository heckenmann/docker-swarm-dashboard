name: MCP branch maintenance

on:
  push:
    branches:
      - feature/mcp-server

permissions:
  contents: write

jobs:
  tidy-and-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: feature/mcp-server

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server-src/go.mod
          cache-dependency-path: server-src/go.sum

      - name: Tidy modules and format Go sources
        run: |
          cd server-src
          go mod tidy
          gofmt -w .

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-src
          git commit -m "Apply Go module and formatting fixes"
          git push origin HEAD:feature/mcp-server
